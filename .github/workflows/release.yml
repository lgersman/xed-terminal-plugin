name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: linuxmintd/mint22-amd64
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential debhelper dpkg-dev meson ninja-build valac \
            gettext pkg-config libgtk-3-dev libgee-0.8-dev libpeas-dev \
            libvte-2.91-dev xed-dev libgtksourceview-4-dev libjson-glib-dev libxapp-dev \
            gnome-common gnome-pkg-tools gobject-introspection libgirepository1.0-dev intltool dh-python

      - uses: actions/checkout@v7

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -oP "version:\s*'\K[^']+" meson.build | head -1)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match meson.build version $version" >&2
            exit 1
          fi

      - name: Build Debian package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../*.deb dist/

      - name: Create source tarball
        run: |
          git archive --prefix="xed-terminal-plugin-${GITHUB_REF_NAME#v}/" \
            -o "dist/xed-terminal-plugin-${GITHUB_REF_NAME#v}.tar.gz" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
